<style>
/* ==========================================================================
   Drew Sparks — digital business card.
   Layout is the original Tenstreet card: Knoxville street map behind a white
   sheet, avatar overhanging an angled header, footer logo and accent bar
   pinned to the bottom. Palette is DriverLanding's — navy structure, amber
   accent — in place of the old red.
   ========================================================================== */
:root{
  --navy:#0b1323;          /* header, primary button, body copy */
  --navy-deep:#060e1e;     /* standalone header, QR surround */
  --amber:#f1b43d;         /* the accent that used to be Tenstreet red */
  --amber-dim:#fabc44;
  --blue:#4cbfe3;
  --text:#1b2233;
  --muted:#8a91a0;
  --bg-gray:#EAEAEA;
  /* How far the portrait rises above the card. Layout has to budget for it. */
  --overhang:88px;
  --font:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

html{-webkit-text-size-adjust:100%}

body{
  font-family:var(--font);
  background-color:var(--bg-gray);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  height:100dvh;
  overflow:hidden;          /* no pull-to-refresh, no page bounce */
  padding:calc(8px + env(safe-area-inset-top)) 20px calc(8px + env(safe-area-inset-bottom));
  position:relative;
  touch-action:none;
}

/* The Knoxville street map. Kept from the original card — it reads as
   transportation without saying so, and it is the city Drew lives in. */
body::before{
  content:"";
  position:fixed;
  /* Bled past the viewport so the parallax shift never uncovers an edge. */
  inset:-26px;
  transform:translate3d(var(--px,0px),var(--py,0px),0);
  will-change:transform;
  background-image:url('assets/knox-BG.png');
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  z-index:-1;
  opacity:.6;
}

@keyframes fadeInUp{
  from{opacity:0;transform:translate3d(0,40px,0)}
  to{opacity:1;transform:translate3d(0,0,0)}
}

.container{
  width:100%;
  max-width:400px;
  position:relative;
  display:flex;
  flex-direction:column;
  overflow:visible;         /* the avatar overhangs the card */
  /* Reserved space for the portrait. It is absolutely positioned, so without
     this the flex centring below has no idea it exists and happily pushes it
     off the top of the viewport — which is exactly what happened in standalone,
     where the taller card left no slack to absorb it. */
  padding-top:var(--overhang);
  animation:fadeInUp .8s cubic-bezier(.2,.8,.2,1);
}

/* Overhanging portrait — this is what makes the sheet read as a card.
   Now the transparent cutout rather than a circular crop: his silhouette breaks
   the card's top edge, and the amber chevron baked into the artwork carries the
   brand shape. drop-shadow follows the alpha, so the shadow traces the figure
   instead of boxing it. */
.profile-avatar{
  width:168px;
  height:168px;
  position:absolute;
  top:0;                    /* the container's padding-top is the overhang */
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  filter:drop-shadow(0 8px 14px rgba(11,19,35,.42));
  pointer-events:none;
}

/* ---------- Card frame ----------
   Fixed height on purpose: the header, footer logo and accent bar stay pinned
   while only the middle channel morphs between the contact list and the QR
   view, so nothing jumps when you toggle. */
.inner-card{
  background-color:#fff;
  box-shadow:0 15px 35px rgba(0,0,0,.2),0 5px 15px rgba(0,0,0,.1);
  border-radius:16px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  position:relative;
  height:650px;
  /* Derived, not guessed. A vh fraction has to be tuned per display mode and
     still breaks whenever the chrome differs; subtracting the overhang and the
     page padding is correct everywhere by construction. */
  max-height:calc(100dvh - var(--overhang) - 40px);
  transition:all .3s cubic-bezier(.4,0,.2,1);
}

@media (display-mode:standalone){
  /* No address bar to budget for, so reclaim the space and sit closer to a
     native sheet. */
  .inner-card{
    height:680px;
    max-height:calc(100dvh - var(--overhang) - 28px);
    border-radius:24px;
    box-shadow:0 25px 50px -12px rgba(0,0,0,.25);
  }
  .header{background-color:var(--navy-deep)}
  #pin-btn{display:flex}
}

#pin-btn{display:none}

/* ---------- Header ----------
   The bottom edge is a landing curve rather than the old straight diagonal:
   the descent flattening out, which is the company's name drawn literally. The
   sweep is an SVG with preserveAspectRatio="none" so it stretches to any card
   width, where a clip-path polygon could only ever be straight. */
.header{
  background-color:var(--navy);
  color:#fff;
  padding:88px 20px 22px;
  position:relative;
  z-index:10;
  text-align:center;
  flex-shrink:0;
}

.header-arc{
  position:absolute;
  left:0;
  bottom:-1px;          /* overlap by a pixel so no seam shows on fractional DPRs */
  width:100%;
  height:56px;
  display:block;
  z-index:2;
}

/* Starfield, matching the site's .starfield-bg but with larger stars so it
   still reads in a header this short. Same three-layer box-shadow technique
   and same brand colours; sizes and speeds scaled up for the smaller box.

   Positions use container query units so they track the header's own box.
   The card is 320-400px wide depending on the handset, and px offsets tuned
   for 400 would drop a fifth of the stars off the right edge on a narrow
   phone. `container-type: size` is safe here only because .header-stars takes
   its size from inset:0 rather than from content — putting it on .header
   itself would collapse the header to nothing. */
.header-stars{
  position:absolute;
  inset:0;
  overflow:hidden;
  z-index:0;
  container-type:size;
  pointer-events:none;
  opacity:.85;
}

.header-stars i{
  --star-white:rgba(255,255,255,.85);
  --star-blue:rgba(76,191,227,.85);
  --star-amber:rgba(241,180,61,.85);
  position:absolute;
  top:0;
  left:0;
  background:transparent;
  display:block;   /* square, as in the other starfield implementations */
}

/* Each layer repeats its stars at +100cqh so the translate loops seamlessly. */
@keyframes starsUp{from{transform:translateY(0)}to{transform:translateY(-100cqh)}}

/* Layer 1 — small, slowest, densest (farthest) */
.header-stars .s1{
  width:2.5px;height:2.5px;
  translate:calc(var(--px,0px) * .4) calc(var(--py,0px) * .4);
  animation:starsUp 90s linear infinite;
  box-shadow:
    8cqw 12cqh var(--star-white),   24cqw 62cqh var(--star-amber),
    41cqw 22cqh var(--star-white),  57cqw 78cqh var(--star-blue),
    70cqw 34cqh var(--star-white),  86cqw 8cqh  var(--star-amber),
    95cqw 55cqh var(--star-white),  14cqw 88cqh var(--star-blue),
    33cqw 44cqh var(--star-white),  78cqw 68cqh var(--star-blue),
    8cqw 112cqh var(--star-white),  24cqw 162cqh var(--star-amber),
    41cqw 122cqh var(--star-white), 57cqw 178cqh var(--star-blue),
    70cqw 134cqh var(--star-white), 86cqw 108cqh var(--star-amber),
    95cqw 155cqh var(--star-white), 14cqw 188cqh var(--star-blue),
    33cqw 144cqh var(--star-white), 78cqw 168cqh var(--star-blue);
}

/* Layer 2 — medium */
.header-stars .s2{
  width:3.5px;height:3.5px;
  translate:calc(var(--px,0px) * .85) calc(var(--py,0px) * .85);
  animation:starsUp 60s linear infinite;
  box-shadow:
    18cqw 36cqh var(--star-blue),   52cqw 14cqh var(--star-white),
    73cqw 50cqh var(--star-amber),  30cqw 80cqh var(--star-white),
    90cqw 26cqh var(--star-white),  6cqw 58cqh  var(--star-amber),
    61cqw 66cqh var(--star-white),
    18cqw 136cqh var(--star-blue),  52cqw 114cqh var(--star-white),
    73cqw 150cqh var(--star-amber), 30cqw 180cqh var(--star-white),
    90cqw 126cqh var(--star-white), 6cqw 158cqh  var(--star-amber),
    61cqw 166cqh var(--star-white);
}

/* Layer 3 — large, fastest, sparsest (nearest) */
.header-stars .s3{
  width:5px;height:5px;
  translate:calc(var(--px,0px) * 1.5) calc(var(--py,0px) * 1.5);
  animation:starsUp 34s linear infinite;
  box-shadow:
    12cqw 28cqh var(--star-amber),  38cqw 72cqh var(--star-white),
    66cqw 18cqh var(--star-blue),   84cqw 84cqh var(--star-white),
    12cqw 128cqh var(--star-amber), 38cqw 172cqh var(--star-white),
    66cqw 118cqh var(--star-blue),  84cqw 184cqh var(--star-white);
}

.name,.title{position:relative;z-index:1}

.name{
  font-size:32px;
  font-weight:800;
  line-height:1.1;
  margin-bottom:6px;
  letter-spacing:-.01em;
}

.title{
  font-size:14px;
  font-weight:500;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--amber);
}

/* ---------- Contact list ---------- */
.content{
  padding:5px 0;
  flex:1;
  min-height:0;
  position:relative;
  background-color:#fff;
  display:flex;
  flex-direction:column;
  justify-content:center;
  /* The frame is a fixed height, so if a row ever cannot fit, scroll this
     channel rather than letting .inner-card's overflow:hidden silently cut it
     off — which is how the original lost its buttons on small handsets. */
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  transition:opacity .2s ease;
}

.contact-item{
  display:flex;
  align-items:center;
  padding:13px 25px;
  text-decoration:none;
  color:var(--text);
  /* Deliberately not transitioning padding. Animating it reflows the whole
     column every frame, and the in-flight value kept the row at its full
     height long enough to overflow the frame. The original faded opacity
     only, for the same reason. */
  transition:background-color .2s ease,border-color .2s ease;
  border-left:4px solid transparent;
  position:relative;
  z-index:1;
}

.contact-item:hover,.contact-item:focus-visible{
  background-color:#faf9f7;
  border-left-color:var(--amber);
}

/* Condensed state: tighten the rows and drop the scheduling link so the QR
   can share the frame with the details worth reading while it is scanned. */
.inner-card.qr-active .contact-item{padding:4px 25px}
.inner-card.qr-active #meeting-item{display:none}

/* The original used a light grey circle with a red glyph — the brand colour
   carried the list. Amber is too light to sit on grey as a glyph, so the tint
   moves to the circle and the glyph stays navy: same warmth, readable icon. */
.icon-box{
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  background-color:rgba(241,180,61,.16);
  border-radius:50%;
  margin-right:18px;
  color:var(--navy);
  transition:background-color .2s,color .2s;
  flex-shrink:0;
}
.icon-box svg{width:18px;height:18px}

.contact-item:hover .icon-box,.contact-item:focus-visible .icon-box{
  background-color:var(--amber);
  color:var(--navy);
}

.info-text{display:flex;flex-direction:column;min-width:0}

.info-label{
  font-size:10px;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:700;
  margin-bottom:3px;
  letter-spacing:.5px;
}

.info-value{
  font-size:16px;
  font-weight:600;
  color:var(--text);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* ---------- Actions ---------- */
.actions{
  padding:4px 20px 8px;
  background:#fff;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  flex-shrink:0;
}

#main-actions,#qr-view{transition:opacity .2s ease-in-out}

#main-actions{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:10px;
  opacity:1;
}
.inner-card.qr-active #main-actions{display:none;opacity:0}

.btn-primary{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
  background-color:var(--navy);
  color:#fff;
  padding:18px;
  border-radius:12px;
  text-decoration:none;
  font-family:var(--font);
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:1px;
  font-size:14px;
  border:none;
  cursor:pointer;
  box-shadow:0 4px 6px rgba(0,0,0,.1);
  transition:transform .1s,background-color .2s;
}
.btn-primary svg{width:17px;height:17px}
.btn-primary:hover{background-color:#16203a}
.btn-primary:active{transform:scale(.98)}

.secondary-row{display:flex;gap:12px;width:100%}

.btn-ghost{
  background:none;
  border:1px solid #e0e0e0;
  color:#666;
  font-family:var(--font);
  font-weight:600;
  font-size:14px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:14px;
  border-radius:12px;
  transition:background-color .2s,color .2s,border-color .2s;
}
.btn-ghost svg{width:16px;height:16px}
.btn-share{flex:4}
.btn-qr{flex:1.2}

.btn-ghost:hover,.btn-ghost:focus-visible{
  background-color:#faf9f7;
  color:var(--navy);
  border-color:var(--amber);
}

/* ---------- QR view ---------- */
#qr-view{
  display:none;
  width:100%;
  opacity:0;
  flex:1;
  flex-direction:column;
  justify-content:center;
  animation:fadeIn .3s ease;
}
.inner-card.qr-active #qr-view{display:flex;opacity:1}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

.black-box-container{
  background-color:var(--navy-deep);
  border-radius:20px;
  padding:20px 0;
  display:grid;
  /* 52px rather than the original 60px: the side bars only hold 34px buttons,
     and the reclaimed width is what lets the code reach its full 200px on a
     phone narrower than the 400px the original assumed. */
  grid-template-columns:52px 1fr 52px;
  align-items:center;
  justify-items:center;
  width:100%;
  box-shadow:0 10px 20px rgba(0,0,0,.1);
}

.qr-side-bar{
  display:flex;
  flex-direction:column;
  background:#161e2e;
  padding:5px;
  border-radius:12px;
  gap:8px;
  width:44px;
}

.qr-side-bar button{
  background:transparent;
  border:none;
  color:#7d879c;
  padding:0;
  border-radius:8px;
  cursor:pointer;
  transition:background-color .2s,color .2s;
  display:flex;
  align-items:center;
  justify-content:center;
  width:34px;
  height:34px;
}
/* display:flex above beats the UA stylesheet's [hidden]{display:none}, so the
   attribute silently does nothing without this -- which would have shipped a
   Send Contact button to every browser that cannot actually share files. */
.qr-side-bar button[hidden]{display:none}
.qr-side-bar button svg{width:16px;height:16px}
.qr-side-bar button:hover{color:var(--amber)}
.qr-side-bar button[aria-selected="true"],
.qr-side-bar button.active{background:var(--amber);color:var(--navy)}

/* Fixed 200px, as the original canvas was. Left fluid, the SVG collapses to
   whatever the flex leftovers allow and the code gets too small to scan. */
#qrcode{
  padding:10px;
  background:#fff;
  border-radius:6px;
  line-height:0;
}
/* height:auto + a square aspect keeps the modules square when the grid column
   is narrower than 200px. A fixed height there stretches the code. */
#qrcode svg{display:block;width:200px;max-width:100%;height:auto;aspect-ratio:1/1}

/* ---------- Footer ---------- */
.footer-logo{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  color:var(--navy);
  text-decoration:none;
  font-weight:800;
  font-size:20px;
  letter-spacing:-.02em;
  opacity:.85;
  transition:opacity .2s;
  padding-top:15px;
  margin-top:auto;
}
.footer-logo:hover{opacity:1}
.footer-logo svg{width:26px;height:26px;flex:none}

.inner-card.qr-active .footer-logo{margin-top:-10px}

/* The site's .text-shimmer gradient and keyframes, run across the bar instead
   of clipped to text, at 16s against the site's 5s — an accent bar that sweeps
   as fast as a headline would be a distraction on a card people are reading. */
@keyframes shimmer{
  0%{background-position:-200% center}
  100%{background-position:200% center}
}
.footer-decoration{
  height:12px;
  background:linear-gradient(90deg,#F1B43D 0%,#F1B43D 35%,#ffffff 45%,#F1B43D 55%,#4CBFE3 80%,#F1B43D 100%);
  background-size:200% auto;
  animation:shimmer 16s linear infinite;
  flex-shrink:0;
}

/* ---------- Full-screen scan mode ----------
   Tapping the code fills the screen with it on white. Nothing a web page can do
   raises screen brightness, but a white field and a much larger code are what
   actually rescue a scan in bad hall lighting or across a table. */
.scan{
  position:fixed;
  inset:0;
  z-index:200;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
  padding:24px;
  opacity:0;
  visibility:hidden;
  transition:opacity .2s ease,visibility .2s;
}
.scan[data-open="true"]{opacity:1;visibility:visible}
.scan svg{
  width:min(86vw,86vh,520px);
  height:auto;
  aspect-ratio:1/1;
  display:block;
}
.scan-hint{
  font-size:11px;
  font-weight:700;
  letter-spacing:1.2px;
  text-transform:uppercase;
  color:#8a91a0;
}

/* ---------- Toast ---------- */
.toast{
  position:fixed;
  bottom:calc(30px + env(safe-area-inset-bottom));
  left:50%;
  transform:translateX(-50%) translateY(100px);
  background-color:var(--navy);
  color:#fff;
  padding:10px 20px;
  border-radius:30px;
  font-size:13px;
  font-weight:600;
  opacity:0;
  transition:transform .3s ease,opacity .3s ease;
  z-index:100;
  box-shadow:0 5px 15px rgba(0,0,0,.2);
  display:flex;
  align-items:center;
  gap:8px;
  pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast svg{width:15px;height:15px;color:var(--amber)}

:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* Short screens: shrink the frame rather than clipping it. The original card
   pinned 650px and hid the overflow, which cut the buttons off on smaller
   handsets. */
@media (max-height:700px){
  /* 75vh leaves too little for the QR view on a short handset — the code, three
     contact rows and the footer cannot all fit, and the list starts scrolling.
     A taller cap plus a smaller code keeps everything visible at once. */
  .inner-card{max-height:88vh}
  :root{--overhang:64px}
  .profile-avatar{width:124px;height:124px}
  .header{padding:64px 20px 26px}
  .header-arc{height:42px}
  .name{font-size:27px}
  .contact-item{padding:7px 25px}
  .btn-primary{padding:15px}
  .footer-logo{font-size:18px;padding-top:10px}
  .black-box-container{padding:10px 0}
  #qrcode svg{width:150px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  /* The parallax offsets are inline styles on :root, and !important in a
     stylesheet outranks a non-important inline style — so this pins the
     background flat even if the easing is mid-flight when the setting flips.
     Parallax is a known vestibular trigger; it does not get to keep running. */
  :root{--px:0px!important;--py:0px!important}
}

.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}
</style>
</head>

<script src="qr.js"></script>
<script>
(function () {
  'use strict';

  /* The canonical address, not window.location.href: the code has to resolve
     for the person scanning it, which rules out whatever local or preview URL
     this page happens to be open at. The site 301s bare->www and /card->/card/,
     so encoding the final form skips two redirects on a bad connection. */
  var CARD_URL = 'https://www.driverlanding.com/card/';

  /* Kept in sync with drew-sparks.min.vcf by build-vcf.py; verify.mjs fails if
     they drift. Inlined rather than fetched so the contact QR still renders
     with no network. */
  var VCARD = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    'N:Sparks;Drew;;;',
    'FN:Drew Sparks',
    'ORG:DriverLanding',
    'TITLE:Founder',
    'TEL;TYPE=CELL:+18652361194',
    'EMAIL:drew@driverlanding.com',
    'URL:' + CARD_URL,
    'END:VCARD'
  ].join('\r\n') + '\r\n';

  var card    = document.getElementById('mainCard');
  var frame   = document.getElementById('qrcode');
  var tabUrl  = document.getElementById('toggle-url');
  var tabVc   = document.getElementById('toggle-vcard');
  var qrBtn   = document.getElementById('qr-btn');
  var toastEl = document.getElementById('toast');
  var toastTx = document.getElementById('toast-text');
  var toastTimer = null;

  function showToast(text) {
    toastTx.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2600);
  }

  /* ---- QR ---- */
  var mode = 'url';

  function renderQR() {
    var isUrl = mode === 'url';
    /* EC level per payload. The link is short enough that level Q costs
       nothing — it lands on the same version M would. The vCard stays at M and
       stays text-only: an embedded photo was tried and pushed the code to 149
       modules, which measurably hurt real-world scanning. Text-only at M is 57
       modules, about 3.3 CSS pixels per module at the 200px this renders at.
       For a photo offline, Send Contact shares the full .vcf instead. */
    frame.innerHTML = QR.toSVG(isUrl ? CARD_URL : VCARD, {
      ecl: isUrl ? 'Q' : 'M',
      quiet: 2,          /* #qrcode's white padding supplies the rest of the quiet zone */
      label: isUrl ? 'QR code linking to this card'
                   : 'QR code containing Drew Sparks contact details'
    });
    tabUrl.setAttribute('aria-selected', String(isUrl));
    tabVc.setAttribute('aria-selected', String(!isUrl));
  }

  function setMode(m) { if (m !== mode) { mode = m; renderQR(); } }
  tabUrl.addEventListener('click', function () { setMode('url'); });
  tabVc.addEventListener('click', function () { setMode('vcard'); });

  /* Keep the screen awake while the code is up. A phone that sleeps mid-scan is
     the single most common reason a handoff needs a second try, and this is the
     one piece of screen behaviour a web page is actually allowed to control. */
  var wakeLock = null;

  async function acquireWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try { wakeLock = await navigator.wakeLock.request('screen'); }
    catch (err) { /* denied or unsupported — not worth surfacing */ }
  }

  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release().catch(function () {}); wakeLock = null; }
  }

  /* A lock is dropped whenever the tab is backgrounded, so re-take it on return
     if the code is still showing. */
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && card.classList.contains('qr-active')) acquireWakeLock();
  });

  function toggleQR(show) {
    if (show) {
      renderQR();
      card.classList.add('qr-active');
      qrBtn.setAttribute('aria-expanded', 'true');
      acquireWakeLock();
      document.getElementById('close-btn').focus();
    } else {
      card.classList.remove('qr-active');
      qrBtn.setAttribute('aria-expanded', 'false');
      closeScan();
      releaseWakeLock();
      setMode('url');
      qrBtn.focus();
    }
  }

  /* ---- Full-screen scan mode ---- */
  var scan = document.getElementById('scan');
  var scanQR = document.getElementById('scan-qr');

  function openScan() {
    scanQR.innerHTML = frame.innerHTML;   /* same SVG, just unconstrained */
    scan.dataset.open = 'true';
  }
  function closeScan() {
    if (scan.dataset.open !== 'true') return;
    scan.dataset.open = 'false';
    scanQR.innerHTML = '';
  }

  frame.addEventListener('click', openScan);
  scan.addEventListener('click', closeScan);

  qrBtn.addEventListener('click', function () { toggleQR(true); });
  document.getElementById('close-btn').addEventListener('click', function () { toggleQR(false); });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    /* Escape backs out one layer at a time: enlarged code first, then the code. */
    if (scan.dataset.open === 'true') closeScan();
    else if (card.classList.contains('qr-active')) toggleQR(false);
  });

  /* ---- Copy ---- */
  function legacyCopy(text) {
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, ta.value.length);   /* iOS needs the explicit range */
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error('copy failed'));
    });
  }

  function copyText(text) {
    /* The Clipboard API can reject even where it exists — denied permission, a
       non-secure origin, or a call the browser does not treat as user-driven.
       Fall back on rejection, not merely on the API being absent. */
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).catch(function () { return legacyCopy(text); });
    }
    return legacyCopy(text);
  }

  document.getElementById('copy-btn').addEventListener('click', function () {
    copyText(CARD_URL)
      .then(function () { showToast('Link copied'); })
      .catch(function () { showToast('Could not copy'); });
  });

  /* ---- Share ---- */
  document.getElementById('share-btn').addEventListener('click', function () {
    var data = {
      title: 'Drew Sparks — DriverLanding',
      text: 'Drew Sparks, Founder of DriverLanding.',
      url: CARD_URL
    };
    if (navigator.share) {
      navigator.share(data).catch(function (err) {
        /* A cancelled share sheet is not a failure worth reporting. */
        if (err && err.name !== 'AbortError') showToast('Share failed');
      });
    } else {
      copyText(CARD_URL)
        .then(function () { showToast('Link copied'); })
        .catch(function () { showToast('Could not copy'); });
    }
  });

  /* ---- Parallax ----
     Feeds two custom properties that the map plane and the three star layers
     read. Nothing here touches layout: the map moves via `transform`, and the
     stars via the independent `translate` property, which composes with the
     `transform` their drift animation already owns — so no wrapper elements are
     needed and no animation gets clobbered. */
  (function parallax() {
    var root = document.documentElement;
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

    var MAX = 14;                       /* px of travel at full tilt */
    var tx = 0, ty = 0, cx = 0, cy = 0, raf = null;

    function frame() {
      /* Ease toward the target so a shaky hand does not jitter the background. */
      cx += (tx - cx) * 0.08;
      cy += (ty - cy) * 0.08;
      root.style.setProperty('--px', cx.toFixed(2) + 'px');
      root.style.setProperty('--py', cy.toFixed(2) + 'px');
      raf = (Math.abs(tx - cx) > 0.05 || Math.abs(ty - cy) > 0.05)
        ? requestAnimationFrame(frame)
        : null;                          /* settle and stop — no idle rAF loop */
    }

    function nudge(x, y) {
      if (reduce.matches) return;
      tx = x; ty = y;
      if (!raf) raf = requestAnimationFrame(frame);
    }

    function recentre() {
      tx = 0; ty = 0;
      if (!raf) raf = requestAnimationFrame(frame);
    }

    /* iOS puts device orientation behind a permission prompt that needs a user
       gesture. Prompting for motion access on a business card would cost more
       goodwill than the effect is worth, so we simply do not run it there. */
    var gated = typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function';

    if (!gated && 'DeviceOrientationEvent' in window) {
      var base = null;
      window.addEventListener('deviceorientation', function (e) {
        if (e.beta == null || e.gamma == null || reduce.matches) return;
        if (!base) base = { b: e.beta, g: e.gamma };   /* calibrate to however it is being held */
        var dg = Math.max(-25, Math.min(25, e.gamma - base.g));
        var db = Math.max(-25, Math.min(25, e.beta - base.b));
        nudge(-dg / 25 * MAX, -db / 25 * MAX);
        /* Drift the neutral point toward the current pose, so holding a tilt
           settles back to centre instead of pinning the background off-axis. */
        base.g += (e.gamma - base.g) * 0.002;
        base.b += (e.beta - base.b) * 0.002;
      }, { passive: true });
    }

    if (window.matchMedia('(pointer: fine)').matches) {
      window.addEventListener('pointermove', function (e) {
        nudge((e.clientX / window.innerWidth - 0.5) * -2 * MAX,
              (e.clientY / window.innerHeight - 0.5) * -2 * MAX);
      }, { passive: true });
    }

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) recentre();
    });

    var onReduceChange = function () { if (reduce.matches) recentre(); };
    reduce.addEventListener ? reduce.addEventListener('change', onReduceChange)
                            : reduce.addListener(onReduceChange);
  })();

  /* ---- Send the contact file to a nearby device ----
     This is the answer to "a photo, offline" that embedding one in the QR was
     not. Sharing the actual .vcf hands over the full card -- 300px photo,
     LinkedIn, scheduling link, the lot -- straight to a nearby phone over
     Quick Share or AirDrop, with no network on either side and no pressure on
     the QR's density. The file is precached by the service worker, so this
     works with no signal.

     Hidden unless the browser will actually take files: canShare({files}) is
     the only honest test, since navigator.share existing says nothing about
     file support. */
  var sendBtn = document.getElementById('send-btn');

  if (sendBtn && navigator.canShare) {
    /* Probe with a dummy file rather than fetching the real one on load --
       the answer is the same and it costs nothing. */
    try {
      var probe = new File(['BEGIN:VCARD\r\nEND:VCARD\r\n'], 'probe.vcf', { type: 'text/vcard' });
      if (navigator.canShare({ files: [probe] })) sendBtn.hidden = false;
    } catch (err) { /* leave it hidden */ }
  }

  if (sendBtn) {
    sendBtn.addEventListener('click', async function () {
      try {
        var res = await fetch('drew-sparks.vcf');
        if (!res.ok) throw new Error('fetch failed');
        var blob = await res.blob();
        var file = new File([blob], 'drew-sparks.vcf', { type: 'text/vcard' });
        if (!navigator.canShare || !navigator.canShare({ files: [file] })) {
          showToast('Sharing files is not supported here');
          return;
        }
        /* Files only, no url alongside: some targets silently drop the file
           when both are present, which would send a link and no contact. */
        await navigator.share({ files: [file], title: 'Drew Sparks — DriverLanding' });
      } catch (err) {
        if (err && err.name !== 'AbortError') showToast('Could not send contact');
      }
    });
  }

  /* ---- Pin to the notification shade ----
     The closest a web app can get to keeping the card on the lock screen. A
     notification with requireInteraction stays put until it is dismissed, shows
     on the lock screen, and reopens the card straight to the code. It is not a
     Live Activity — the web has no equivalent — and it does not survive a
     reboot, but it needs no backend and works today on Android. */
  var pinBtn = document.getElementById('pin-btn');

  if (pinBtn) {
    pinBtn.addEventListener('click', async function () {
      if (!('Notification' in window) || !('serviceWorker' in navigator)) {
        showToast('Not supported here');
        return;
      }
      var perm = Notification.permission;
      if (perm === 'default') {
        try { perm = await Notification.requestPermission(); }
        catch (err) { perm = 'denied'; }
      }
      if (perm !== 'granted') {
        showToast(perm === 'denied' ? 'Notifications are blocked' : 'Permission needed');
        return;
      }
      try {
        var reg = await navigator.serviceWorker.ready;
        await reg.showNotification('Drew Sparks — DriverLanding', {
          body: 'Tap to show the QR code',
          tag: 'dl-card',            /* replaces rather than stacking up */
          renotify: false,
          icon: 'assets/icon-192.png',
          badge: 'assets/icon-badge-96.png',
          requireInteraction: true,  /* sticks until dismissed */
          silent: true,              /* no sound or vibration mid-conversation */
          data: { url: './index.html?view=qr' }
        });
        showToast('Pinned to notifications');
      } catch (err) {
        showToast('Could not pin');
      }
    });
  }

  /* Tapping that notification wakes this page rather than opening a second
     copy, so the service worker asks whichever window it focused to show the
     code. */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message', function (e) {
      if (e.data && e.data.action === 'show-qr') toggleQR(true);
    });
  }

  /* ---- Offline ---- */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* non-fatal */ });
    });
  }

  /* Straight to the code when launched from the home screen — you opened this
     standing in front of someone — or when arrived at via ?view=qr, which is
     what the icon long-press shortcut and the pinned notification both use. */
  var wantsQR = /(^|[?&])view=qr(&|$)/.test(window.location.search);
  if (wantsQR ||
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true) {
    setTimeout(function () { toggleQR(true); }, 400);
  }
})();
</script>
</body>
</html>
